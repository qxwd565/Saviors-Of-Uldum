name: Verify and normalize card API to Legacy
on:
  push:
    branches: [main]
    paths:
      - 'cards.json'
      - 'data/**'
      - 'metadata/**'
      - '.github/workflows/unify-legacy-api.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-api-${{ github.repository }}-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and normalize card JSON
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/qxwd565/legacy/a3c04b21a974d6ae66bef016eabdd7eb1f82b4c9/tools/unify-card-apis.py -o /tmp/unify-card-apis.py
          python3 /tmp/unify-card-apis.py
          python3 /tmp/unify-card-apis.py --apply
          python3 /tmp/unify-card-apis.py
          git diff --check
      - name: Commit canonical API if needed
        run: |
          git add cards.json data metadata
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: normalize card timelines to Legacy date-keyed format"
            git push origin HEAD:main
          fi
