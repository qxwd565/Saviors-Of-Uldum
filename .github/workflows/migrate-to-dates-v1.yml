name: Normalize HSdeck dated cards
on:
  push:
    paths:
      - '.github/workflows/migrate-to-dates-v1.yml'
      - 'tools/dated-migration-dates.json'
      - 'data/**'
      - 'cards.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dated-cards-saviors-of-uldum
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable shared converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/733f4fb359732b0a3599029387082e968d77010a/tools/convert-to-dates-v1.py' -o /tmp/convert-to-dates-v1.py
      - name: Verify and convert date-first card sources
        run: |
          python /tmp/convert-to-dates-v1.py --root . --strict
          python /tmp/convert-to-dates-v1.py --root . --strict --check
          git diff --check
      - name: Cross-check first-use dates and fill card list metadata
        run: |
          python - <<'PYRELEASE'
          import json
          from pathlib import Path
          catalog=Path("cards.json")
          payload=json.loads(catalog.read_text(encoding="utf-8"))
          if len(payload.get("cards",[]))!=170: raise SystemExit("Catalog size changed")
          special={}
          normal="2019-08-07"
          for item in payload["cards"]:
              doc=json.loads((Path("data")/(item["id"]+".json")).read_text(encoding="utf-8"))
              dates=sorted(k for k in doc if len(k)==10 and k[4]=="-" and k[7]=="-")
              if not dates: raise SystemExit("Missing dated history: "+item["id"])
              first=doc[dates[0]]
              if first.get("id")!=item["id"] or first.get("dbfId")!=item["dbfId"]: raise SystemExit("Identity mismatch: "+item["id"])
              expected=special.get(item["id"],normal)
              if dates[0]!=expected: raise SystemExit("Unexpected first-use day "+item["id"]+": "+dates[0]+" expected "+expected)
              if item.get("releasedAt") not in (None,dates[0]): raise SystemExit("Conflicting date: "+item["id"])
              item["releasedAt"]=dates[0]
              item["releaseStatus"]="verified"
          catalog.write_text(json.dumps(payload,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          PYRELEASE
      - name: Commit dated JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/ cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Convert Saviors-Of-Uldum to dates-v1 JSON [skip ci]'
            git push origin HEAD:main
          fi
